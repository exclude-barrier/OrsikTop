[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
allow-dirty = ["ci"]
installers = ["shell"]
targets = ["x86_64-unknown-linux-gnu"]
install-path = "~/.local/bin"
install-updater = true
checksum = "sha256"
hosting = ["github"]
github-attestations = true
pr-run-mode = "plan"
# Backticks would be expanded as command substitutions by the shell installer
# (the message is embedded in a double-quoted `say "..."` line), which would
# execute `orsiktop` / `orsiktop update` during installation.
install-success-msg = "OrsikTop is installed. Run orsiktop to start it and orsiktop update to update it."
