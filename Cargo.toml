[package]
name = "orsiktop"
version = "0.4.4"
edition = "2021"
# Effective floor of the dependency set (currently sysinfo 0.39.6, which
# declares rust-version 1.95). CI checks this floor in a dedicated MSRV job
# (.github/workflows/ci.yml) and builds the main gate on a pinned stable.
rust-version = "1.95"
description = "Fast terminal monitoring for local LLM Orks"
license = "Apache-2.0"
repository = "https://github.com/exclude-barrier/OrsikTop"
readme = "README.md"
keywords = ["llm", "llama-cpp", "tui", "monitoring", "nvidia"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
nvml-wrapper = "0.13"
# Minimal feature set: the TUI only uses the crossterm backend plus
# Paragraph/Block/Borders/Clear widgets. default-features would pull in the
# calendar widget (and its time stack), the st!/stylize!/layout! macros, and
# the termwiz/termina backend tree — none of which is used and none of which
# is ever compiled, but all of which sits in Cargo.lock, the SBOM and audits.
# `layout-cache` is kept for layout performance.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
sysinfo = "0.39"

[profile.dist]
inherits = "release"
lto = "thin"
