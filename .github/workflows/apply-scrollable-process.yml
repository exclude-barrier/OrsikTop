name: Apply scrollable process pane

on:
  push:
    branches: [feat/history-process-pane-scroll-fix, feat/scrollable-process-pane]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scrollable-process-pane
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python .github/scripts/apply_scrollable_process.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help >/dev/null
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_scrollable_process.py
          rm .github/workflows/apply-scrollable-process.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add src/app.rs src/ui.rs .github/scripts/apply_scrollable_process.py .github/workflows/apply-scrollable-process.yml
          git commit -m "Make process pane scrollable and roomier"
          git push origin feat/scrollable-process-pane
