name: Apply clickable process sorting

on:
  push:
    branches: [feat/clickable-process-sorting]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clickable-process-sorting
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: |
          python .github/scripts/apply_process_sorting.py
          python .github/scripts/fix_process_sorting_clippy.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help >/dev/null
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_process_sorting.py
          rm .github/scripts/fix_process_sorting_clippy.py
          rm .github/workflows/apply-process-sorting.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add clickable process sorting"
            git push origin HEAD:feat/clickable-process-sorting
          fi
