name: Apply process double-click pin

on:
  push:
    branches: [feat/process-double-click-pin]
    paths:
      - .github/scripts/apply_double_click_pin.py
      - .github/workflows/apply-double-click-pin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/process-double-click-pin
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python .github/scripts/apply_double_click_pin.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help >/dev/null
      - name: Remove temporary patch files
        run: rm -f .github/scripts/apply_double_click_pin.py .github/workflows/apply-double-click-pin.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          git commit -m "Separate process selection from double-click pinning"
          git push origin HEAD:feat/process-double-click-pin
