name: Apply GPU engine row patch

on:
  push:
    branches:
      - fix/gpu-engine-row

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gpu-engine-row
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Move engine metrics to their own row
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui.rs')
          lines = p.read_text().splitlines()
          start = next(i for i in range(len(lines) - 1) if lines[i].strip() == 'fixed_data_pair(' and lines[i + 1].strip() == '"ENC",')
          engine = lines[start:start + 18]
          del lines[start:start + 18]
          if lines[start].strip() != ']),':
              raise SystemExit(f'unexpected I/O close line: {lines[start]!r}')
          insert_at = start + 1
          new_row = [
              '        Line::from(vec![',
              '            label_span("        "),',
              '            Span::raw(" ".repeat(bar_width + 9)),',
              *engine,
              '        ]),',
          ]
          lines[insert_at:insert_at] = new_row
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Format and test
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-gpu-engine-row.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui.rs .github/workflows/apply-gpu-engine-row.yml
          git commit -m 'Move ENC DEC and LIMIT to dedicated GPU row'
          git push origin HEAD:fix/gpu-engine-row
