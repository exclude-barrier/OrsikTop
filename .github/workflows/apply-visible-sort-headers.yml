name: Apply visible process sort headers

on:
  push:
    branches: [feat/visible-process-sort-controls]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visible-process-sort-controls
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python .github/scripts/apply_visible_sort_headers.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help >/dev/null
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_visible_sort_headers.py
          rm .github/workflows/apply-visible-sort-headers.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make process sort headers visually clickable"
            git push origin HEAD:feat/visible-process-sort-controls
          fi
