name: Apply GPU panel polish

on:
  push:
    branches: [feat/gpu-panel-polish]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/gpu-panel-polish

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply patch
        run: python3 tools/apply_gpu_panel_polish.py

      - name: Format
        run: cargo fmt --all

      - name: Remove temporary patch tooling
        run: |
          rm tools/apply_gpu_panel_polish.py
          rm .github/workflows/apply-gpu-polish.yml

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish GPU panel layout and telemetry"
          git push origin HEAD:feat/gpu-panel-polish
