name: Apply physical core minibars

on:
  push:
    branches: [feat/core-minibars]
    paths:
      - .github/workflows/apply-core-minibars.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-minibars
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python .github/scripts/apply_core_minibars.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help
      - name: Remove temporary patch files
        run: rm .github/scripts/apply_core_minibars.py .github/workflows/apply-core-minibars.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace CPU heatmap with physical core minibars"
          git push origin HEAD:feat/core-minibars
