name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # 1.99.1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets --locked

      - name: Cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets --locked

      - name: Cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          createIssues: false
          denyWarnings: true

      - name: Install cargo-deny
        run: |
          cargo install cargo-deny --version 0.20.2 --locked || {
            # rust-cache can restore a stale binary without its install
            # state; drop it and retry once.
            echo "cargo-deny install failed; removing stale binary and retrying"
            rm -f "$CARGO_HOME/bin/cargo-deny"
            cargo install cargo-deny --version 0.20.2 --locked
          }

      - name: Cargo deny
        run: cargo deny check

      - name: Generate SBOM
        run: python3 scripts/sbom.py --locked > orsiktop-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orsiktop-sbom
          path: orsiktop-sbom.cdx.json
          retention-days: 7

      - name: CLI smoke test
        run: |
          cargo run --locked -- --help
          # `diag` reads the real /sys, /proc and runs one bounded llama probe;
          # on a headless runner (no GPU, no server) it must still exit 0.
          cargo run --locked -- diag

  # Guarantees the declared floor (rust-version in Cargo.toml) still builds:
  # a dependency whose own rust-version exceeds the floor fails this job with
  # a clear cargo error, so the declared MSRV can never silently rot.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MSRV
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cargo check at MSRV
        run: cargo check --locked --all-targets
