name: Apply pinned process selection

on:
  push:
    branches: [feat/pinned-process-selection]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pinned-process-selection
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python .github/scripts/apply_pinned_process_selection.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help >/dev/null
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply_pinned_process_selection.py
          rm .github/workflows/apply-pinned-process-selection.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pin selected process by PID"
            git push origin HEAD:feat/pinned-process-selection
          fi
