name: Apply system CPU telemetry

on:
  push:
    branches:
      - feat/system-cpu-telemetry
    paths:
      - .github/workflows/apply-system-cpu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/system-cpu-telemetry
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python .github/scripts/apply-system-cpu.py
      - name: Fix generated patch
        run: |
          sed -i 's/(displayed_cores + 1) \/ 2/displayed_cores.div_ceil(2)/' src/ui.rs
          sed -i 's/5\.882352941/5.555555556/' src/app.rs
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply-system-cpu.py
          rm .github/workflows/apply-system-cpu.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand system CPU telemetry"
          git push origin HEAD:feat/system-cpu-telemetry
