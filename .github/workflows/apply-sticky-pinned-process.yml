name: Apply sticky pinned process

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/apply_sticky_pinned_process.py
      - .github/workflows/apply-sticky-pinned-process.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python .github/scripts/apply_sticky_pinned_process.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo run --locked -- --help >/dev/null
      - name: Remove temporary patch files
        run: rm -f .github/scripts/apply_sticky_pinned_process.py .github/workflows/apply-sticky-pinned-process.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          git commit -m "Keep pinned process fixed at top" || exit 0
          git push origin HEAD:main
