name: Apply MTP status patch

on:
  push:
    branches:
      - feat/mtp-status

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mtp-status
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python3 .github/scripts/patch_mtp_status.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary patch files
        run: rm .github/workflows/apply-mtp-status.yml .github/scripts/patch_mtp_status.py
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add src/llama.rs src/ui.rs .github/workflows/apply-mtp-status.yml .github/scripts/patch_mtp_status.py
          git commit -m "Separate MTP status from acceptance"
          git push origin HEAD:feat/mtp-status
