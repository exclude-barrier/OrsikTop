name: Apply bar gradients

on:
  push:
    branches: [feat/bar-gradients]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bar-gradients
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: |
          python .github/gradient_patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui.rs')
          s = p.read_text()
          s = s.replace('\nfn fine_bar(percent: f64, width: usize) -> (String, String) {', '\n#[cfg(test)]\nfn fine_bar(percent: f64, width: usize) -> (String, String) {', 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary patch files
        run: |
          rm .github/gradient_patch.py
          rm .github/workflows/apply-bar-gradients.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          git commit -m "Add semantic load gradients to meter bars"
          git push origin HEAD:feat/bar-gradients
