name: Apply LLM final pass

on:
  push:
    branches: [feat/llm-panel-final]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-panel-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python .github/llm_final_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary patch files
        run: |
          rm .github/llm_final_patch.py
          rm .github/workflows/apply-llm-final.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          git commit -m "Polish LLM inference hierarchy"
          git push origin HEAD:feat/llm-panel-final
