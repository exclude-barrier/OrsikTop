name: Fix GPU column alignment

on:
  push:
    branches:
      - fix/gpu-column-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gpu-column-alignment
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Align GPU rows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ui.rs')
          text = path.read_text()
          old = 'Span::raw(" ".repeat(bar_width + 9)),'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 GPU alignment targets, found {count}')
          text = text.replace(old, 'Span::raw(" ".repeat(bar_width + 7)),')
          path.write_text(text)
          PY
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-gpu-alignment.yml
      - name: Commit result
        shell: bash
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add src/ui.rs .github/workflows/fix-gpu-alignment.yml
          git commit -m "Align GPU telemetry columns"
          git push origin HEAD:fix/gpu-column-alignment
