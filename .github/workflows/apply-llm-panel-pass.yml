name: Apply LLM panel pass

on:
  push:
    branches: [feat/llm-panel-pass]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-panel-pass
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: |
          python .github/llm_panel_patch.py
          sed -i 's/(raw.len() - index) % 3 == 0/(raw.len() - index).is_multiple_of(3)/' src/ui.rs
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary patch files
        run: |
          rm .github/llm_panel_patch.py
          rm .github/workflows/apply-llm-panel-pass.yml
      - name: Commit result
        run: |
          git config user.name "exclude-barrier"
          git config user.email "christopher@cloudfiebig.de"
          git add -A
          git commit -m "Refine VRAM gradient and LLM inference panel"
          git push origin HEAD:feat/llm-panel-pass
