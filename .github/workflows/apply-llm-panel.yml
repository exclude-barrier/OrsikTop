name: Apply LLM inference panel patch

on:
  push:
    branches:
      - feat/llm-inference-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-inference-panel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply patch
        run: python3 tools/apply_llm_panel.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Remove temporary patch files
        run: rm .github/workflows/apply-llm-panel.yml tools/apply_llm_panel.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/llama.rs src/ui.rs .github/workflows/apply-llm-panel.yml tools/apply_llm_panel.py
          git commit -m 'Separate live request and server LLM telemetry'
          git push origin HEAD:feat/llm-inference-panel
