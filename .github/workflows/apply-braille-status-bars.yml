name: Apply Braille status bars

on:
  push:
    branches: [feat/braille-status-bars]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/braille-status-bars
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply Braille bar renderer
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ui.rs')
          s = p.read_text()

          old_pair = '    let text = format!("  {label:<7}{value}");\n'
          new_pair = '    let text = format!("  {label:<7} {value}");\n'
          if old_pair not in s:
              raise SystemExit('fixed_data_pair pattern not found')
          s = s.replace(old_pair, new_pair, 1)

          start = s.index('fn fine_bar(percent: f64, width: usize) -> (String, String) {')
          end = s.index('\nfn trend_lines(', start)
          new_fn = '''fn fine_bar(percent: f64, width: usize) -> (String, String) {
              if width == 0 {
                  return (String::new(), String::new());
              }

              // Braille gives two horizontal subcells per terminal cell.
              // Full = ⣿, half = ⣇ (left column filled + baseline), empty = ⣀.
              let units = ((clamp_percent(percent) / 100.0) * (width * 2) as f64).round() as usize;
              let full = (units / 2).min(width);
              let half = full < width && units % 2 == 1;

              let mut filled = "⣿".repeat(full);
              if half {
                  filled.push('⣇');
              }

              let used_cells = full + usize::from(half);
              let empty = "⣀".repeat(width.saturating_sub(used_cells));
              (filled, empty)
          }
          '''
          s = s[:start] + new_fn + s[end:]

          old_test = '''    #[test]
              fn fine_bar_has_subcell_resolution() {
                  assert_eq!(fine_bar(0.0, 4), ("".to_string(), "····".to_string()));
                  assert_eq!(fine_bar(12.5, 1), ("▏".to_string(), "".to_string()));
                  assert_eq!(fine_bar(50.0, 2), ("█".to_string(), "·".to_string()));
                  assert_eq!(fine_bar(100.0, 2), ("██".to_string(), "".to_string()));
              }
          '''
          if old_test not in s:
              # tolerate rustfmt indentation from current file
              old_test = '''    #[test]
              fn fine_bar_has_subcell_resolution() {
                  assert_eq!(fine_bar(0.0, 4), ("".to_string(), "····".to_string()));
                  assert_eq!(fine_bar(12.5, 1), ("▏".to_string(), "".to_string()));
                  assert_eq!(fine_bar(50.0, 2), ("█".to_string(), "·".to_string()));
                  assert_eq!(fine_bar(100.0, 2), ("██".to_string(), "".to_string()));
              }
          '''
          # use direct exact block from source if present
          source_test = '''    #[test]
              fn fine_bar_has_subcell_resolution() {
                  assert_eq!(fine_bar(0.0, 4), ("".to_string(), "····".to_string()));
                  assert_eq!(fine_bar(12.5, 1), ("▏".to_string(), "".to_string()));
                  assert_eq!(fine_bar(50.0, 2), ("█".to_string(), "·".to_string()));
                  assert_eq!(fine_bar(100.0, 2), ("██".to_string(), "".to_string()));
              }
          '''

          # replace by locating the test function rather than relying on whitespace
          tstart = s.index('    #[test]\n    fn fine_bar_has_subcell_resolution() {')
          tend = s.index('\n    #[test]', tstart + 10)
          new_test = '''    #[test]
              fn fine_bar_has_subcell_resolution() {
                  assert_eq!(fine_bar(0.0, 4), ("".to_string(), "⣀⣀⣀⣀".to_string()));
                  assert_eq!(fine_bar(10.0, 10), ("⣿".to_string(), "⣀⣀⣀⣀⣀⣀⣀⣀⣀".to_string()));
                  assert_eq!(fine_bar(25.0, 2), ("⣇".to_string(), "⣀".to_string()));
                  assert_eq!(fine_bar(50.0, 2), ("⣿".to_string(), "⣀".to_string()));
                  assert_eq!(fine_bar(100.0, 2), ("⣿⣿".to_string(), "".to_string()));
              }
          '''
          s = s[:tstart] + new_test + s[tend:]
          p.write_text(s)
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-braille-status-bars.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui.rs .github/workflows/apply-braille-status-bars.yml
          git commit -m "Render status meters with Braille bars"
          git push origin HEAD:feat/braille-status-bars
