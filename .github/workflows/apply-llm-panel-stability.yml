name: Apply LLM panel stability fix

on:
  push:
    branches: [fix/llm-panel-stability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/llm-panel-stability
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply patch
        run: python .github/scripts/run_fix_llm_panel_stability.py
      - name: Format
        run: cargo fmt
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs src/llama.rs src/ui.rs
          git commit -m "Improve LLM panel detail and connection stability"
          git push
